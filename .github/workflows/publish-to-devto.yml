name: Publish to dev.to

on:
  push:
    branches:
      - main
    paths:
      - "articles/*.md"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to detect new/modified files

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install gray-matter node-fetch
        working-directory: scripts

      - name: Detect changed .md files
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'articles/*.md' | tr '\n' '|')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Publish changed articles to dev.to
        if: steps.changed.outputs.files != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          IFS='|' read -ra FILES <<< "${{ steps.changed.outputs.files }}"
          for FILE in "${FILES[@]}"; do
            if [ -n "$FILE" ] && [ -f "$FILE" ]; then
              echo "Publishing: $FILE"
              node scripts/publish.js "$FILE"
            fi
          done
