name: Publish to dev.to

on:
  push:
    branches:
      - main
    paths:
      - "articles/*.md"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install gray-matter node-fetch
        working-directory: scripts

      - name: Detect changed .md files
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'articles/*.md' | tr '\n' '|')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Publish changed articles to dev.to
        if: steps.changed.outputs.files != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          IFS='|' read -ra FILES <<< "${{ steps.changed.outputs.files }}"
          for FILE in "${FILES[@]}"; do
            if [ -n "$FILE" ] && [ -f "$FILE" ]; then
              echo "Publishing: $FILE"
              node scripts/publish.js "$FILE"
            fi
          done

      - name: Commit devto_id back to repo
        if: steps.changed.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No devto_id changes to commit." || (
            git add articles/
            git commit -m "chore: backfill devto_id [skip ci]"
            git push
          )

      - name: Dispatch sync to personal-portfolio
        if: steps.changed.outputs.files != ''
        env:
          PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -n "$PORTFOLIO_DISPATCH_TOKEN" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer $PORTFOLIO_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/glatinone/personal-portfolio/dispatches \
              -d '{"event_type":"articles-updated"}'
            echo "Portfolio sync dispatched."
          else
            echo "PORTFOLIO_DISPATCH_TOKEN not set — skipping dispatch."
          fi
